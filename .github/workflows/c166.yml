# The C166 backend's own checks.
#
# Nothing else here runs them: every workflow this repository inherits from
# upstream is gated on the llvm organisation, and the ones that build anything
# want LLVM's own runner fleet, so on a fork they all skip.  This one is
# deliberately ungated and sized to fit a stock runner.
#
# It builds only what the target needs, then runs, in order: the lit suites,
# the assembly round trip, and the differential tests - which are the part
# that actually executes code, comparing what the simulator computes against
# what the host computes for the same program.

name: C166

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: c166-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test the C166 target
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install what the build needs
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache

      # ccache 3 kept its cache in ~/.ccache and ccache 4 keeps it in
      # ~/.cache/ccache, so naming either one here depends on which version
      # the runner image happens to have.  Say where it goes instead.
      - name: Say where the compiler cache goes
        run: |
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=2G" >> "$GITHUB_ENV"
          # ccache makes this when it first stores something, which is too
          # late for a save that runs after a build that failed early.
          mkdir -p "$HOME/.ccache"

      # A from scratch build of this is over an hour; with the cache warm it
      # is a few minutes.  The key moves with the compiler sources so that a
      # change to them does not reuse stale objects, and the restore key lets
      # a new key start from the last one rather than from nothing.
      #
      # Restoring and saving are separate steps because actions/cache does its
      # saving in a post step marked post-if: success(), and a run that failed
      # is exactly the one whose next attempt should not start from nothing.
      - name: Restore the compiler cache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: c166-ccache-${{ github.sha }}
          restore-keys: |
            c166-ccache-

      # lldb is here because this target's debugger support is not all in
      # llvm/lib/Target/C166: five commits changed IRMemoryMap, IRInterpreter,
      # LLVMUserExpression, DWARFExpression, SymbolFileDWARF, TypeSystemClang
      # and ClangExpressionDeclMap, and until it was built here none of that
      # was compiled by CI at all.  Measured before it was added, in CPU
      # minutes of compiling from the ninja log of a full build:
      #
      #   clang                      218
      #   llvm and everything else   144
      #   lldb                       102
      #   lldb's unit tests           32
      #   lld                         11
      #
      # so it is 36% on top of a build that was 372, against a timeout of 180
      # minutes for a from-scratch build the cache note above calls "over an
      # hour".  What a run with a warm cache pays is not that: ccache answers
      # for the objects, and what is left is linking.  A run that changed
      # nothing under lldb/ pays 17 seconds, which is the tests themselves; one
      # that changed a header everything includes pays those plus a liblldb.so
      # at about half a minute and 45 unit test binaries at 1.8 minutes of CPU
      # between them.  Its objects are 116 MByte against the 478 the rest of
      # the build makes, so the 2G cache above has room.
      #
      # The five options are pinned rather than left to cmake so that what the
      # runner happens to have installed - Python, curses, libedit - cannot
      # quietly turn this into a bigger build than the one that was measured.
      - name: Configure
        run: |
          cmake -S llvm -B build -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_ASSERTIONS=ON \
            -DLLVM_ENABLE_PROJECTS="clang;lld;lldb" \
            -DLLVM_TARGETS_TO_BUILD="X86" \
            -DLLVM_EXPERIMENTAL_TARGETS_TO_BUILD="C166" \
            -DLLDB_ENABLE_PYTHON=OFF \
            -DLLDB_ENABLE_CURSES=OFF \
            -DLLDB_ENABLE_LIBEDIT=OFF \
            -DLLDB_ENABLE_LZMA=OFF \
            -DLLDB_ENABLE_LUA=OFF \
            -DLLVM_CCACHE_BUILD=ON \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_OPTIMIZED_TABLEGEN=ON

      # llvm-lit is deliberately not in this list: cmake writes it at configure
      # time rather than building it, so asking ninja for it is an error.
      - name: Build
        run: |
          ninja -C build clang lld lldb llc opt llvm-mc llvm-objdump \
            llvm-objcopy llvm-readobj llvm-readelf llvm-nm llvm-dwarfdump \
            llvm-symbolizer llvm-ar llvm-ranlib llvm-size llvm-config \
            c166-sim FileCheck count not split-file

      - name: Save the compiler cache
        if: always() && steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: c166-ccache-${{ github.sha }}

      # What the cache actually did, so that a run which quietly rebuilds
      # everything says so rather than just taking an hour and a half.
      - name: Compiler cache statistics
        if: always()
        run: ccache -s

      # A tool the tests ask for and the build did not produce would otherwise
      # be found an hour in, as "command not found" in the middle of a run.
      # This reads the names out of the tests, so it is a few seconds and it
      # keeps itself up to date.
      - name: Check the tools the tests need were built
        run: ./llvm/utils/C166Sim/differential/checktools.sh ./build/bin

      # Assertions are on, so a malformed node or a bad assumption stops the
      # build rather than producing something that only looks right.
      #
      # This is the whole list, and testdirs.txt is the whole of it: a second
      # step with a second list is what let a regression through, by passing a
      # local sweep over that file while an lld test the file did not name was
      # failing.  Unquoted, and run from the root of the tree, because a line
      # of it may be a glob - the lld tests are one - and the shell is what
      # expands it.
      - name: Lit tests
        run: |
          ./build/bin/llvm-lit -sv $(grep -v '^#' \
            llvm/utils/C166Sim/differential/testdirs.txt)

      # The half of this target's debugger work that can be tested where it
      # lives.  The C166 sessions in llvm/utils/C166Sim/README.txt cannot be:
      # LLDB's own suite has no C166 toolchain to build a program with, so a
      # test there would be a test nothing runs.  What these do cover is the
      # generic machinery those sessions lean on - a DWARF expression's address
      # class marker, and an IRMemoryMap whose addresses have to fit in a
      # pointer narrower than the architecture's.
      #
      # 32315 tests, 2 skipped, none failing, in 14 seconds of test time -
      # unlike the lldb-shell suite, which fails 96 of its tests in a tree
      # configured for this target alone, because anything that compiles a
      # program gets "unknown target triple 'unknown'".  That one is
      # deliberately not here.
      - name: LLDB unit tests
        run: ninja -C build check-lldb-unit

      # What comes out of the compiler has to assemble back to the same bytes,
      # which is what catches a name or a syntax the assembler reads
      # differently from the way the compiler wrote it.
      - name: Assembly round trip
        run: ./llvm/utils/C166Sim/differential/roundtrip.sh ./build/bin

      # crt0, the block functions and the compiler-rt builtins: code for the
      # target, which the build above does not produce.
      - name: Build the sysroot
        run: ./llvm/utils/C166Sim/differential/mksysroot.sh ./build "$HOME/c166-sysroot"

      - name: Differential tests
        run: |
          ./llvm/utils/C166Sim/differential/run.sh ./build/bin \
            "$HOME/c166-sysroot" llvm/lib/Target/C166/startup/c166.ld

      # What the corpus costs, against the recorded baseline.  This is where a
      # change that quietly gives back a size or speed win somebody measured by
      # hand is noticed; it builds only for the target, because whether the
      # answers are right is the differential tests' job above.
      - name: Code size and state counts
        run: |
          ./llvm/utils/C166Sim/corpus/sizes.sh ./build/bin \
            "$HOME/c166-sysroot" llvm/lib/Target/C166/startup/c166.ld

      # Programs nobody wrote, so that the cover is not limited to what
      # somebody thought of.  The seed range moves with the run number, so
      # each run tries programs the last one did not.
      - name: Generated programs
        run: |
          FIRST=$(( (${{ github.run_number }} * 40) % 100000 + 1 ))
          ./llvm/utils/C166Sim/differential/fuzz.sh ./build/bin \
            "$HOME/c166-sysroot" llvm/lib/Target/C166/startup/c166.ld 40 "$FIRST"
